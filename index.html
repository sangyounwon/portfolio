<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sangyoun Won — Portfolio</title>
<style>
@font-face{font-family:"Barlow";src:url("fonts/Barlow-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Barlow";src:url("fonts/Barlow-Medium.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Barlow";src:url("fonts/Barlow-SemiBold.ttf") format("truetype");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Barlow";src:url("fonts/Barlow-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
:root{--arc:"Barlow","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--light:#ededed;--dark:#101113;--ink:#111;--mute:#8b8b8b;--line:#d6d6d6;
  --mono:"Barlow","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --sans:"Barlow","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--dark)}
body{font-family:var(--sans);font-size:15px;line-height:1.55;color:#e9e9e9}
a{color:inherit}
button{font:inherit}
.mono{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.view{display:none}.view.on{display:block}

.nav{--fg:rgba(255,255,255,.82);--fg-on:#fff;--tint:rgba(255,255,255,.10);--on-bg:rgba(255,255,255,.34);--shadow:0 8px 28px rgba(0,0,0,.28);--ts:0 1px 2px rgba(0,0,0,.4);
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:2px;padding:6px;border-radius:999px;isolation:isolate;
  background:var(--tint);-webkit-backdrop-filter:blur(10px) saturate(1.9) brightness(1.08);backdrop-filter:blur(10px) saturate(1.9) brightness(1.08);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 22px rgba(255,255,255,.07)}
.nav.lens{-webkit-backdrop-filter:url(#lg) blur(8px) saturate(1.9) brightness(1.08);backdrop-filter:url(#lg) blur(8px) saturate(1.9) brightness(1.08)}
.nav::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:-1;
  background:linear-gradient(140deg,rgba(255,255,255,.44),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.24));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.nav a{position:relative;font-size:15px;color:var(--fg);text-shadow:var(--ts);text-decoration:none;padding:7px 18px;border-radius:999px;white-space:nowrap;cursor:pointer}
.nav a:hover{color:var(--fg-on)}
.nav a{z-index:1;transition:color .35s}
.nav a.on{color:var(--fg-on)}
.nav .ind{position:absolute;top:6px;bottom:6px;left:0;right:0;border-radius:999px;background:var(--on-bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.15);pointer-events:none;z-index:0;transform-origin:center;transition:transform .25s ease,opacity .3s}
.nav .ind.mv{transform:scale(1.03,.86)}
.nav[data-tone=light]{--fg:rgba(18,22,22,.62);--fg-on:#111;--tint:rgba(255,255,255,.38);--on-bg:rgba(255,255,255,.78);--shadow:0 6px 22px rgba(0,0,0,.10);--ts:none}

.home{--peek:120px;position:relative;height:calc(100vh - var(--peek));height:calc(100svh - var(--peek));min-height:560px;overflow:hidden;background:#0c0d0f;color:#e6e6e8}
.home .slides{position:absolute;inset:0}
.home .slide{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease;pointer-events:none}
.home .slide.on{opacity:1}
.home .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.8) saturate(.9);transform:scale(1.035) translateX(-1.5%);opacity:0;transition:transform 0s linear 2.4s,opacity 1.8s ease}
.home .hl i::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,255,255,var(--gb,.2));box-sizing:border-box;box-shadow:inset 0 0 12px 0 rgba(255,255,255,var(--gi,.05));-webkit-mask-image:conic-gradient(from var(--g,0deg),transparent 0deg,#000 15deg,transparent 30deg,transparent 360deg);mask-image:conic-gradient(from var(--g,0deg),transparent 0deg,#000 15deg,transparent 30deg,transparent 360deg)}   /* 원 일부 구간이 밝게 아래로 회전(앞뒤 대칭 그라데이션) */
.home .slide img.cur{opacity:1;transform:scale(1.05) translateX(1.5%);transition:transform 8s linear,opacity 1.8s ease}   /* 약간 확대 + 오른쪽으로 천천히 이동 */ 
.home::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(8,9,11,.84) 0%,rgba(8,9,11,.6) 24%,rgba(8,9,11,.22) 48%,rgba(8,9,11,0) 66%),linear-gradient(0deg,rgba(8,9,11,.5) 0%,rgba(8,9,11,0) 30%)}
.home .hl{position:absolute;inset:0;z-index:1;display:flex;pointer-events:none}
.home .hl i{flex:1;border-left:1px solid rgba(255,255,255,.09)}
.home .hl i:nth-child(5){border-left-color:rgba(255,255,255,.2)}
.home .hin{position:relative;z-index:2;height:100%;padding:92px 24px 30px;display:flex;flex-direction:column;justify-content:flex-end}
.home .tag{color:#a4a4a9;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.home .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ha,#e8431f);transition:background .8s}
.home h1.nm{font-family:var(--mono);font-weight:700;font-size:clamp(40px,min(9.6vw,13vh),150px);line-height:.94;letter-spacing:-.012em;color:#dcdcdf;text-transform:uppercase}
.home .kr{font-size:clamp(18px,2.2vw,34px);font-weight:400;color:#c4c4c8;margin:14px 0 10px;letter-spacing:-.01em}
.home .sum{max-width:none;word-break:keep-all;color:#b3b3b8;font-size:15px;line-height:1.7}
.home .stats{display:flex;gap:clamp(22px,4vw,64px);margin:20px 0 22px}
.home .stats b{display:block;font-family:var(--mono);font-weight:700;font-size:clamp(26px,3vw,44px);letter-spacing:-.03em;color:#dcdcdf;line-height:1}
.home .stats span{display:block;margin-top:6px;color:#8d8d92}
.home .foot2{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:28px}
.home .prog{display:flex;align-items:center;gap:14px;color:#9a9aa0}
.home .prog .bars{display:flex;gap:6px}
.home .prog .bars i{width:34px;height:2px;background:rgba(255,255,255,.22);position:relative;overflow:hidden;cursor:pointer;display:block}
.home .prog .bars i::after{content:"";position:absolute;inset:0;background:#e6e6e8;transform:scaleX(0);transform-origin:left}
.home .prog .bars i.done::after{transform:scaleX(1)}
.home .prog .bars i.on::after{animation:hprog var(--dur,8s) linear forwards}
.home.paused .prog .bars i.on::after{animation-play-state:paused}
@keyframes hprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.home .cap2{display:flex;align-items:flex-end;gap:18px;text-align:right}
.home .cap2 a{text-decoration:none;color:inherit;display:block;cursor:pointer}
.home .cap2 .k{color:var(--ha,#e8431f);transition:color .8s}
.home .cap2 .t{font-family:var(--mono);font-weight:700;font-size:clamp(14px,1.5vw,22px);letter-spacing:.02em;text-transform:uppercase;color:#dcdcdf;margin:4px 0 2px}
.home .cap2 .s{color:#8d8d92}
.home .arr{display:flex;gap:8px}
.home .arr button{position:relative;isolation:isolate;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6);
  box-shadow:0 6px 20px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.07)}
.home .arr button:hover{background:rgba(255,255,255,.2)}
.home .arr svg{width:16px;height:16px;fill:#fff}
.home .arr .l svg{transform:scaleX(-1)}
@media(max-width:760px){.home .hin{padding:84px 16px 28px}.home .foot2{flex-direction:column;align-items:flex-start}.home .cap2{text-align:left}.home .stats{gap:22px}.home .sum{font-size:14px}}
@media(max-height:780px){.home .sum{display:none}.home .kr{margin:10px 0 6px}}
@media (prefers-reduced-motion:reduce){.home .slide img,.home .slide img.cur{transition:none;transform:none}.home .hl i::after{display:none}}

.bblur{position:fixed;left:0;right:0;bottom:0;height:clamp(128px,22vh,220px);z-index:12;pointer-events:none}
.bblur i{position:absolute;inset:0;display:block}
.bblur i:nth-child(1){-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);-webkit-mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 62%);mask-image:linear-gradient(to top,#000 0%,#000 30%,transparent 62%)}
.bblur i:nth-child(2){-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(to top,#000 0%,#000 18%,transparent 48%);mask-image:linear-gradient(to top,#000 0%,#000 18%,transparent 48%)}
.bblur i:nth-child(3){-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);-webkit-mask-image:linear-gradient(to top,#000 0%,#000 8%,transparent 34%);mask-image:linear-gradient(to top,#000 0%,#000 8%,transparent 34%)}
@media(max-width:760px){.bblur{height:112px}}

.title .pg-no,.about .pg-no{color:#e8431f}
.title .tags,.about .tags{margin-bottom:0}
.about .tags{margin-bottom:clamp(14px,1.6vw,24px)}

.about{background:var(--light);color:var(--ink);padding:56px 16px 24px}
.about .ab-t{font-family:var(--mono);font-weight:700;font-size:clamp(44px,9.4vw,140px);line-height:.98;letter-spacing:-.012em;color:#3b3b3b;text-transform:uppercase;margin:12px 0 18px}
.about .ab-intro{max-width:560px;margin-bottom:clamp(56px,8vw,120px)}
.about .ab-intro p{font-size:17px;line-height:1.75;color:#222;margin-bottom:22px}
.about .ab-rows{border-bottom:1px solid #b9b9b9;max-width:1100px}
.about .ab-row{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:16px 24px;padding:14px 0;border-top:1px solid #b9b9b9;align-items:start}
.about .ab-row .l{font-size:15px;color:#222}
.about .ab-row .r{display:flex;flex-direction:column;gap:2px;font-size:15px;color:#2a2a2a;line-height:1.55}
.about .ab-row.cv .l{color:#6f6f73;padding-top:2px}
.about .ab-row.cv .r b{font-weight:400;font-size:16px}
.about .ab-row.cv .r .sub{color:#555;font-size:14px}
@media(max-width:760px){.about .ab-row{grid-template-columns:1fr;gap:6px}.about .ab-intro p{font-size:15.5px}}

.about .ab-row .l.sw{font-size:11px;color:#8b8b8b;padding-top:6px}
.about .ab-row .l small{display:block;margin-top:3px;font-size:13px;font-weight:500;color:#6f6f73}

.about .ab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,min(780px,58%));column-gap:clamp(32px,6vw,120px);align-items:start}
.about .ab-col.r{justify-self:end;width:100%}
.about .ab-intro{max-width:560px;margin-bottom:clamp(40px,6vw,80px)}
.about .ab-acc{margin-bottom:clamp(20px,3vw,40px)}
.about .ab-acc:last-child{border-bottom:0}
.about .ab-h{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 0;cursor:pointer;font-size:20px;font-weight:700;letter-spacing:-.01em;color:#222}
.about .ab-h:hover{color:#000}
.about .ab-h:focus-visible{outline:2px solid #888;outline-offset:2px}
.about .pm{position:relative;width:14px;height:14px;flex:none}
.about .pm::before,.about .pm::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#222;transition:transform .3s}
.about .pm::after{transform:rotate(90deg)}
.about .ab-h[aria-expanded="true"] .pm::after{transform:rotate(0deg)}
.about .ab-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.about .ab-acc.open .ab-body{grid-template-rows:1fr}
.about .ab-body .in{overflow:hidden;min-height:0}
.about .ab-rows{max-width:none;border-bottom:0}
.about .ab-row{grid-template-columns:minmax(96px,34%) 1fr}
.about .ab-acc .ab-row:first-child{border-top:0}
.about .ab-col.l .ab-intro{margin-top:var(--intro-top,15px)}
.about .ab-row.cv{grid-template-columns:112px minmax(0,180px) 1fr;gap:16px;padding:16px 0;align-items:baseline}
.about .ab-row.cv .r{display:contents}
.about .ab-row.cv .l{padding-top:0}
.about .ab-row.cv .r .sub{white-space:nowrap}
@media(max-width:860px){.about .ab-row.cv{grid-template-columns:96px 1fr}.about .ab-row.cv .r{display:flex;flex-direction:column;gap:2px}.about .ab-row.cv .r .sub{white-space:normal}}
@media(max-width:860px){.about .ab-grid{grid-template-columns:1fr}.about .ab-col.r{justify-self:stretch}}

.about .ab-t{font-family:var(--arc);font-weight:700;letter-spacing:.005em;line-height:.92;font-size:clamp(44px,9.4vw,140px);text-transform:uppercase}
.about .ab-intro p,.about .ab-h,.about .ab-row .l:not(.mono),.about .ab-row .r,.about .ab-row.cv .r b,.about .ab-row.cv .r .sub,.about .chip{font-family:var(--arc)}
.about .ab-intro p{font-weight:500}
.about .ab-intro p,.about .ab-row .r,.about .ab-row.cv .r .sub{word-break:keep-all;overflow-wrap:break-word}
.about .ab-h{font-weight:400}
.about .ab-h.static{cursor:default}
.about .ab-row .r,.about .ab-row .l:not(.mono){font-weight:500}
.about .ab-row.cv .r b{font-weight:400}

.title{background:var(--light);color:var(--ink);border-top:1px solid #d6d6d6;padding:36px 16px 40px}
.title .mono{color:var(--mute)}
.title h1{font-family:var(--mono);font-weight:700;font-size:clamp(44px,9.4vw,140px);line-height:.98;letter-spacing:-.012em;color:#3b3b3b;text-transform:uppercase;margin:12px 0 18px}
.title .intro{max-width:340px}
.title .intro b{display:block;font-weight:400;font-size:20px;color:var(--ink);text-transform:none;letter-spacing:0;margin-bottom:6px;font-family:var(--sans)}
.stage{padding:16px;display:grid;gap:16px}
.big{position:relative;aspect-ratio:1971/595;border-radius:8px;overflow:hidden;background:var(--c);cursor:pointer;display:block;border:0;width:100%;text-align:left;padding:0;color:inherit}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.big::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--c) 0%,transparent 55%),linear-gradient(0deg,rgba(0,0,0,.45),transparent 40%);opacity:.85}
.big .info{position:absolute;z-index:2;left:20px;top:18px;right:20px;display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr 1.6fr;gap:14px 24px;color:#fff}
.big .info .mono{color:rgba(255,255,255,.55);display:block;margin-bottom:3px}
.big .info div>span:not(.mono){font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.big .code{position:absolute;z-index:2;left:20px;bottom:18px;color:#fff;display:flex;gap:12px;align-items:baseline}
.big .code .n{font-family:var(--mono);color:var(--a)}
.big .code .t{font-size:clamp(18px,2.4vw,34px);letter-spacing:-.01em}
.small{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:16px}
.mcard{display:block;border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer}
.mcard .im{aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--c)}
.mcard img{width:100%;height:100%;object-fit:cover;display:block}

.big img,.mcard img{will-change:transform;transition:transform .6s}
.big:hover img,.mcard:hover img,.big:focus-visible img,.mcard:focus-visible img{transform:scale(1.065)}
@media (hover:none){.big:hover img,.mcard:hover img{transform:none}}
.mcard .cap{display:flex;gap:10px;align-items:baseline;padding:12px 0 10px}
.mcard .cap .n{font-family:var(--mono);font-size:12px;color:var(--a)}
.mcard .cap .t{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.mfoot{padding:56px 16px 24px;display:grid;grid-template-columns:1fr 1fr;gap:24px 40px;color:#bbb}
.mfoot .mono{color:#7d7d80}
.mfoot .row{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:6px 0}
.mfoot .word{grid-column:1/-1;font-family:var(--mono);font-weight:700;font-size:clamp(44px,9.4vw,140px);letter-spacing:-.012em;color:#b4b4b8;margin-top:40px;line-height:.98;white-space:nowrap;text-transform:uppercase}

.hero{position:relative;aspect-ratio:3.1/1;background:#000;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center var(--hp,55%);display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 35%)}
.head{background:var(--light);color:var(--ink);padding:40px 16px 56px}
.head .no{color:var(--a)}
.head h1{font-family:var(--mono);font-weight:700;font-size:clamp(44px,9.4vw,140px);line-height:.98;letter-spacing:-.012em;color:#3b3b3b;text-transform:uppercase;margin:12px 0 18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px}
.tags span{border:1px solid #bdbdbd;border-radius:999px;padding:5px 12px;color:#5a5a5a}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:start}
.desc h2{color:var(--mute);margin:0 0 8px}
.desc p{font-size:16px;line-height:1.75;max-width:62ch;margin-bottom:28px;color:#222}
.info-l{border-top:1px solid var(--line)}
.info-l>div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.info-l dt{color:var(--mute);padding-top:2px}
.info-l dd{font-size:14px;color:#222}
.gallery{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gallery figure{aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#1a1b1e;cursor:zoom-in}
.gallery figure.full{grid-column:1/-1}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.next{padding:56px 16px 24px}
.next .lab{color:#7d7d80;margin-bottom:14px}
.next .grid{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:16px}
.ncard{display:block;text-decoration:none;color:inherit;cursor:pointer}
.ncard .im{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--c)}
.ncard img{width:100%;height:100%;object-fit:cover;display:block}

.ncard img{filter:grayscale(1) brightness(.92);transition:filter .45s ease}
.ncard:hover img,.ncard:focus-visible img{filter:grayscale(0) brightness(1)}
@media (hover:none){.ncard img{filter:none}}
.ncard .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:2px}
.ncard .cap{display:flex;gap:10px;align-items:baseline;padding:12px 0 10px}
.ncard .n{font-family:var(--mono);font-size:12px;color:var(--c)}
.ncard .t{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--light);border:1px solid #c6c6c6;border-radius:999px;padding:5px 13px 5px 9px;font-size:13px;color:#2b2b2b;line-height:1}
.chip.t{padding-left:13px}
.chip svg{width:16px;height:16px;display:block;color:#3a3a3a;flex:none}

.hz{position:relative;overflow:hidden;container-type:inline-size}
.hz img{will-change:transform;transition:transform .6s;transform-origin:50% 0}
.hz:hover img{transform:scale(1.065)}
@media (hover:none){.hz:hover img{transform:none}}
.modal{flex-direction:column;gap:14px}
.lbwrap{width:100%;display:flex;flex-direction:column;align-items:center}
.vp{position:relative;overflow:hidden;width:min(calc(100vw - 32px),calc((100vh - 32px)*16/9));aspect-ratio:16/9;background:#000;border-radius:4px}
.vp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;will-change:transform}
.vp #mImg2{transform:translateX(100%)}

/* 하단 개수 표시 / CLOSE / 좌우 화살표 모션: 이전 속도(투명도 1초, 이동 1.1초) */
.vp .sq{transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,1,.36,1)}
.modal .x{transition:padding 1s cubic-bezier(.22,1,.36,1),background .25s,gap 1s,transform 1.1s cubic-bezier(.22,1,.36,1)}
.modal .x .lbl{transition:max-width 1s cubic-bezier(.22,1,.36,1),opacity 1s ease,margin 1s cubic-bezier(.22,1,.36,1)}
.modal .x .xx{transition:font-size 1s cubic-bezier(.22,1,.36,1)}
.vp .nv{transition:opacity .3s,transform .3s,background 1s ease,box-shadow 1s ease,backdrop-filter 1s ease,-webkit-backdrop-filter 1s ease}
.vp .nv::after{transition:opacity 1s ease}
.vp .nv svg{transition:filter 1s ease}
/* 바깥 그림자는 모든 상태(어두움/밝음, 숨김/표시 이동 중)에서 제거 */
.nav,.nav[data-tone=dark],.nav[data-tone=light],.nav.away{--shadow:0 0 0 transparent}
/* 하단 개수 표시: 이미지 틀 가장자리(잘림 영역) 안에서만 움직이도록 이동 거리를 줄이고, 완만한 곡선으로 투명도 변화가 주가 되게 */
.vp .sq{transition:opacity 1s ease,transform 1.1s cubic-bezier(.4,0,.2,1)}
.vp .sq.away{transform:translateY(14px)}
@media (prefers-reduced-motion:reduce){}
/* 숨김 = 위로 사라지는 대신, 메뉴가 얇은 바로 축소되며 바와 교차(크로스페이드) */
.nav{transform-origin:50% 0;transition:background .35s,box-shadow .35s,transform 1s cubic-bezier(.4,0,.2,1),opacity .9s ease}
.nav.away{transform:translate(-50%,-7px) scaleY(.108);opacity:0}
.nav a{transition:color .35s,opacity .5s ease}
.nav.away a{opacity:0}
.nav .ind{transition:transform .25s ease,opacity .5s}
@media (prefers-reduced-motion:reduce){.nav{transition:background .35s,box-shadow .35s,opacity .3s}.nav.away{transform:translate(-50%,0)}}

/* 메뉴 접힘 = 같은 요소가 얇은 글래스 바로 변형(모핑): 높이가 줄고, 선택 항목의 흰 알약이 바 안의 흰 구간이 된다 */
.nav{height:var(--nh,46px);box-sizing:border-box;transform-origin:50% 0;transition:background .8s ease,box-shadow .8s ease,height .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),padding .9s cubic-bezier(.4,0,.2,1)}
.nav a{transition:color .35s,opacity .45s ease}
.nav .ind{top:6px;bottom:6px}
.nav.away{height:5px;top:7px;padding-top:0;padding-bottom:0;opacity:1;pointer-events:auto;transform:translateX(-50%);background:rgba(255,255,255,.18)}
.nav[data-tone=light].away{background:rgba(120,126,134,.3)}
.nav.away a{opacity:0;pointer-events:none}
.nav.away .ind{top:0;bottom:0;background:rgba(255,255,255,.94);box-shadow:none}
.nav.away::before{content:"";position:absolute;left:-30px;right:-30px;top:-14px;bottom:-22px}
@media (prefers-reduced-motion:reduce){.nav{transition:background .3s,height .01s,top .01s,padding .01s}}
/* 참고 샘플(21st.dev glass-nav)의 접힘 타이밍: 글자 투명도·폭/높이 변화가 같은 곡선(.2,.8,.2,1)으로 동시에 진행, 펼칠 때는 글자가 조금 늦게 나타남 */
.nav{transition:background .6s cubic-bezier(.2,.8,.2,1),box-shadow .6s cubic-bezier(.2,.8,.2,1),height .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1),padding .8s cubic-bezier(.2,.8,.2,1)}
.nav a{transition:color .35s,opacity .35s cubic-bezier(.2,.8,.2,1) .26s}
.nav.away a{transition:color .35s,opacity .32s cubic-bezier(.2,.8,.2,1) 0s}
/* 선택 상태 표시: 모든 배경/접힘 상태에서 같은 반투명 글래스 알약으로 통일 */
.nav,.nav[data-tone=light],.nav[data-tone=dark]{--on-bg:rgba(255,255,255,.34)}
.nav .ind{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.15),inset 0 0 0 1px rgba(255,255,255,.18)}
.nav.away .ind{background:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}

/* 홈 세로줄: 위에서 아래로 그려지고, 이후 약한 빛줄기가 천천히 흐름 */
.home .hl i{position:absolute;top:50%;left:0;width:var(--d,900px);height:var(--d,900px);margin-top:calc(var(--d,900px)/-2);flex:none;box-sizing:border-box;border:1px solid rgba(255,255,255,var(--a,.08));border-radius:50%;clip-path:inset(0 0 0 50%);will-change:transform}
.home .hl i::before{bottom:0;background:rgba(255,255,255,var(--a,.08));}

.home .hl i:nth-child(1){--k:0}.home .hl i:nth-child(2){--k:1}.home .hl i:nth-child(3){--k:2}.home .hl i:nth-child(4){--k:3}.home .hl i:nth-child(5){--k:4}.home .hl i:nth-child(6){--k:5}.home .hl i:nth-child(7){--k:6}.home .hl i:nth-child(8){--k:7}


/* ---------- 텍스트 등장 모션 (aerleum.com 방식: 줄 단위 마스크 + 아래에서 올라옴, 줄마다 0.133s 간격) ---------- */
html.rvpre .home .tag,html.rvpre .home .nm,html.rvpre .home .sum,html.rvpre .home .stats,html.rvpre .home .foot2{visibility:hidden}
/* 분할용 span이 .tags span 같은 기존 span 스타일(테두리·여백)을 물려받지 않도록 초기화 */
html body .rv-ln.rv-ln,html body .rv-li.rv-li,html body .rv-w.rv-w{border:0;border-radius:0;background:none;box-shadow:none;text-transform:inherit;letter-spacing:inherit}
html body .rv-ln.rv-ln{padding:0;margin:0}
html body .rv-li.rv-li,html body .rv-w.rv-w{padding:0;margin:0}
html body .rv-w.rv-w{display:inline}
.rv-ln{display:block;clip-path:inset(-.12em -.06em -.12em -.06em)}   /* 레이아웃을 바꾸지 않는 마스크(원래 높이·여백과 동일) */
.rv-li{display:block;white-space:nowrap;transform:translateY(125%);transition:transform 1s cubic-bezier(.77,0,.175,1);transition-delay:var(--d,0s)}
.rv-on .rv-li{transform:none}
.rv-fade{opacity:0;transform:translateY(24px);transition:opacity .9s ease var(--d,0s),transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.rv-fade.rv-on{opacity:1;transform:none}
.rv-fade-o{opacity:0;transition:opacity .9s ease var(--d,0s)}
.rv-fade-o.rv-on{opacity:1}
.rv-nt,.rv-nt::before{transition:none!important}
.home .tag.rv-dot::before{opacity:0;transform:scale(0);transition:transform 1s cubic-bezier(.77,0,.175,1) var(--dd,0s),opacity .6s ease var(--dd,0s),background .8s}   /* 라벨 앞 빨간 점도 글씨와 함께 나타남 */
.home .tag.rv-dot.rv-on::before{opacity:1;transform:none}
.about .ab-row.rv-row{position:relative;border-top-color:transparent}                      /* 경력 가로선: 왼쪽에서 오른쪽으로 그려진 뒤 글씨가 올라옴 */
.about .ab-row.rv-row::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:#b9b9b9;transform:scaleX(0);transform-origin:0 50%;transition:transform 1.1s cubic-bezier(.77,0,.175,1) var(--d,0s)}
.about .ab-row.rv-row.rv-on::before{transform:none}
.about .ab-acc .ab-row:first-child.rv-row::before{display:none}
@media (prefers-reduced-motion:reduce){.about .ab-row.rv-row{border-top-color:#b9b9b9}.about .ab-row.rv-row::before{display:none}.rv-li{transform:none;transition:none}.rv-fade,.rv-fade-o{opacity:1;transform:none;transition:none}}

function bindHeroCrop(v,shots){

    const W=hero.clientWidth,Hc=hero.clientHeight,ar=(v.videoWidth&&v.videoHeight)?v.videoWidth/v.videoHeight:16/9,Hd=W/ar;
    if(Hd<=Hc){v.style.objectPosition="center 50%";return}
    const range=Hd-Hc,off=Math.max(0,Math.min(range,sh[2]*Hd-Hc/2));
    v.style.objectPosition="center "+(off/range*100).toFixed(2)+"%";
  };
  heroApply=()=>apply(v.currentTime);
  if(v.requestVideoFrameCallback){const loop=(n,m)=>{apply(m.mediaTime);v.requestVideoFrameCallback(loop)};v.requestVideoFrameCallback(loop)}
  v.addEventListener("timeupdate",heroApply);v.addEventListener("seeked",heroApply);v.addEventListener("loadedmetadata",heroApply);

const HOME={i:0,t:null,dur:8000,ready:false,paused:false,start:Date.now(),off:0};

function homeShow(i,off=0){
  const n=Math.min(4,P.length);HOME.i=(i+n)%n;HOME.start=Date.now()-off;const p=P[HOME.i],root=$("vMain").querySelector(".home");if(!root)return;
  root.querySelectorAll(".slide").forEach((el,k)=>{el.classList.toggle("on",k===HOME.i);if(k!==HOME.i)el.querySelectorAll("img.cur").forEach(e=>e.classList.remove("cur"))});
  clearTimeout(HOME.sub);const im=[...root.querySelectorAll(".slide")[HOME.i].querySelectorAll("img")];
  HOME.vis=HOME.vis||[];if(HOME.lastI!==HOME.i){HOME.vis[HOME.i]=(HOME.vis[HOME.i]===undefined?0:HOME.vis[HOME.i]+1);HOME.lastI=HOME.i}   /* 일시정지 후 이어보기에서는 조합 유지 */
  const pick=(HOME.vis[HOME.i]%2?[2,3]:[0,1]).filter(k=>im[k]),seg=HOME.dur/pick.length;
  let c=Math.min(pick.length-1,Math.floor(off/seg));                                      /* 이어보기면 지난 시간만큼 건너뛰어 노출 시간을 균등하게 */
  void root.offsetWidth;                                                                   /* 삽입 직후에도 확대·이동 전환이 시작되도록 스타일 확정 */
  im.forEach((e,k)=>{if(k!==pick[c])e.classList.remove("cur")});showImg(im[pick[c]]);
  if(pick.length>1&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    let el=off;const step=()=>{if(c>=pick.length-1)return;HOME.sub=setTimeout(()=>{if(HOME.paused)return;const prev=im[pick[c]],nxt=im[pick[c+1]];c++;el=seg*c;showImg(nxt,()=>prev.classList.remove("cur"));step()},seg*(c+1)-el)};step()}
  root.querySelectorAll(".bars i").forEach((el,k)=>{el.classList.remove("on");el.classList.toggle("done",k<HOME.i);el.style.animationDelay=k===HOME.i&&off?"-"+off+"ms":"";if(k===HOME.i){void el.offsetWidth;el.classList.add("on")}});
